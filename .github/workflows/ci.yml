name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aphelion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: train and evaluate (held-out)
        run: |
          npm run train -w @aphelion/api
          npm run eval -w @aphelion/api
      - name: postgres migrations and pg smoke
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aphelion_ci
          DATABASE_SSL: "false"
        run: |
          npm run migrate -w @aphelion/api
          npm run test:pg -w @aphelion/api --if-present

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build first: it generates .next/types that the standalone typecheck references.
      - run: npm run build -w @aphelion/web
      - run: npm run typecheck -w @aphelion/web
