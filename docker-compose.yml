# Local stack: Postgres plus the Project Aphelion API against the real pg repositories.
# The API still runs in mock Razorpay and mock LLM mode, so no external
# credentials or real money are involved. Bring it up with: docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aphelion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aphelion"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aphelion_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/aphelion
      DATABASE_SSL: "false"
      RAZORPAY_MODE: mock
      LLM_PROVIDER: mock
      # Local-only placeholder so production config validation passes. This is not
      # a real secret and is unused in mock mode. Set a real one for razorpay_test.
      RAZORPAY_WEBHOOK_SECRET: whsec_local_compose_placeholder
      LOG_PRETTY: "false"
    command: ["npm", "run", "start:prod"]
    ports:
      - "4000:4000"

volumes:
  aphelion_pg:
